# V013 generates per-queue natively compiled procs (CREATE PROCEDURE
# ... WITH NATIVE_COMPILATION) that SCHEMABIND memory-optimized tables.
# The auto-upgrade cursor at the end calls these generators for each
# existing in-memory queue, which runs DDL on memory-optimized objects.
# SQL Server does not allow such DDL inside a user transaction; Flyway
# must run this migration outside its default transaction wrapper.
executeInTransaction=false
